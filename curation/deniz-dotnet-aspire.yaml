# Intended sources: the complete Microsoft Aspire workflow package plus the
# selected Aspire specialists from dotnet-skills.
# Follow reviewed merged upstream main ahead of release tags.
# Runtime behavior stays upstream-owned; patches only bind in-package routes while preserving
# project-local skill precedence. Upstream eval and plugin-level hook machinery is not shipped.
plugin:
  name: deniz-dotnet-aspire
  description: "Deniz's curated .NET Aspire skills"
  version: 0.6.0
items:
  - source: aspire-skills/skills/aspire
    invocation: both # stated so the passthrough posture is explicit: the model routes Aspire work here and
    # the user keeps the slash command, which auto would remove
    omit: ["evals/**"] # upstream Copilot/vally evaluation assets are not harness runtime content
    body: patch # guard the router and both migration references' in-package routes in every harness;
    # the manual Project v2 migration is a body-only user-pointer, so it stays out of INVOKES and depends_on
    depends_on:
      - aspire-init
      - aspireify
      - aspire-orchestration
      - aspire-deployment
      - aspire-monitoring
  - source: aspire-skills/skills/aspire-init
    invocation: both # stated so the passthrough posture is explicit; auto would remove the slash command
    omit: ["evals/**"] # upstream evaluation assets are not harness runtime content
    body: patch # localize the bootstrap handoffs without changing the upstream workflow
    # aspire: the 13.5 no-`--mcp` branch lives only in the router's Skills vs. MCP guidance
    depends_on: [aspire, aspireify, aspire-orchestration, aspire-deployment, aspire-monitoring]
  - source: aspire-skills/skills/aspireify
    invocation: both # stated so the passthrough posture is explicit; auto would remove the slash command
    omit: ["evals/**"] # upstream evaluation assets are not harness runtime content
    body: patch # localize authoring handoffs, including the CLI migration owned by orchestration; drop the
    # description's INVOKES line, which repeats its summary, so the rendered description fits 1,024 characters
    depends_on: [aspire-init, aspire-orchestration, aspire-deployment, aspire-monitoring]
  - source: aspire-skills/skills/aspire-orchestration
    invocation: both # stated so the passthrough posture is explicit; auto would remove the slash command
    omit: ["evals/**"] # upstream evaluation assets are not harness runtime content
    body: patch # localize lifecycle routing while preserving project-local precedence; drop the
    # description's trailing "below" so the rendered description fits 1,024 characters
    depends_on: [aspireify, aspire-init, aspire-deployment, aspire-monitoring]
  - source: aspire-skills/skills/aspire-deployment
    invocation: both # stated so the passthrough posture is explicit; auto would remove the slash command
    omit: ["evals/**"] # upstream evaluation assets are not harness runtime content
    body: patch # localize deployment's retained sibling handoffs
    depends_on: [aspireify, aspire-orchestration, aspire-monitoring]
  - source: aspire-skills/skills/aspire-monitoring
    invocation: both # stated so the passthrough posture is explicit; auto would remove the slash command
    omit: ["evals/**"] # upstream evaluation assets are not harness runtime content
    body: patch # localize diagnostics routing to the packaged sibling skills
    depends_on: [aspire-orchestration, aspire-deployment, aspireify]
  - source: aspire-skills/skills/aspire-project-v2-migration
    invocation: manual # approval-first rewrite of experimental 13.6+ project resources; only an explicit user
    # decision starts it, unlike the primary workflows above, which the model must be able to reach
    omit: ["evals/**"] # upstream evaluation assets are not harness runtime content
    body: patch # localize the sibling handoffs; approval gates and project-local precedence stay upstream-owned
    depends_on: [aspire-orchestration, aspire-init, aspireify, aspire-deployment, aspire-monitoring]
  - source: dotnet-skills/skills/aspire-integration-testing
    invocation: auto # Aspire-native testing target required by the guarded Akka/Aspire cookbook handoff;
    # its current upstream body and companions remain unowned despite known example/API proof limits
  - source: dotnet-skills/skills/aspire-service-defaults
    invocation: auto # canonical shared OTel, health, resilience, and HTTP service-discovery guidance
    body: patch # its description led with "Create a shared ServiceDefaults project" and its body
    # hand-writes a net9.0 project with a fixed package list, beside the one aspire init or the
    # installed template makes. The description now names customizing the project, and a missing
    # one defers to aspireify or the aspire-servicedefaults template, which also keeps aspireify's
    # legacy-host guard in the path; the hand-written files stay as a reading of what the project holds
    depends_on: [aspireify] # the deferral is a checked fact

  # --- exclusions ---
  - source: aspire-skills/.github/skills/pr-review
    exclude: true # upstream repository-maintainer review workflow, not an Aspire application skill
  - source: dotnet-skills/skills/aspire-configuration
    exclude: true # its application service-discovery ban contradicts the selected ServiceDefaults approach
  - source: dotnet-skills/skills/aspire-mailpit-integration
    exclude: true # broken Aspire/Mailpit APIs and compile errors make the large cookbook unsafe to ship

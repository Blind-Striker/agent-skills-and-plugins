# Intended sources: none upstream. This Module holds the dispatch harness, a .NET file-based app
# bundled as the harness skill's source, and the judgment skill for delegating to worker models of
# another family. It lives apart from Process so that only a user who dispatches needs .NET
# (ADR-0009). It requires Process for the coordinator's review read; Process reaches it only
# through guarded optional pointers.
plugin:
  name: deniz-dispatch
  description: "Deniz's worker-delegation harness and judgment (dispatch tasks to other model families)"
  version: 0.1.0
original_skills:
  delegating-to-worker-models:
    invocation: both # the user's routing decision spends the quota, not loading these rules, and the
    # failures it prevents happen when a coordinator writes a worker prompt without them; the narrow
    # description keeps it off ordinary in-harness subagent work, and the reliable trigger is the load
    # line its addendum template asks each dispatching repository to carry, curator's call
    depends_on: [delegating-to-worker-models, requesting-code-review] # requesting-code-review is the
    # coordinator's own review read, and it makes this Module require Process. The self entry is the
    # load line the addendum template hands each dispatching repository, rendered in every harness's
    # own spelling. verified-waves stays a user pointer because the human starts that ceremony; it
    # needs no guard because Process is already required. Language test rules stay generic: this
    # Module names no General skill, so a repository addendum quotes them
    # Model-specific countermeasures live one file per model under references/models/, curator's
    # call: not every model overbuilds, so the generic worker contract carries hygiene only.
    # Intake for pilot lessons, curator's call: a lesson enters the body only when it holds beyond one
    # repository or tool, is not an instance of an existing rule, and recurred or cost real money;
    # otherwise it goes to the research note's pilot log. The per-case coordinator rules from the
    # first pilot day were folded into one no-contradiction pass for that reason
  harness:
    invocation: both # the judgment skill routes a coordinator to this skill by name, and a caller
    # loads it from inside another skill, so the model must be able to invoke it: a manual skill
    # cannot be loaded through the skill tool. The narrow description keeps it off ordinary work, and
    # the trigger probe tunes that description, not this choice
    depends_on: [delegating-to-worker-models] # the body sends a coordinator who writes a code task's
    # prompt or judges a worker's output to the judgment skill; a caller with structured tasks owns
    # its own prompt and does not need it

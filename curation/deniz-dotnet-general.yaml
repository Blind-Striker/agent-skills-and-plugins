  - source: dotnet-agent-skills/plugins/dotnet-msbuild/skills/check-bin-obj-clash
    invocation: auto # output-path collision diagnosis — the classic file-lock culprit
    body: patch # its binlog capture and its see-also routes pointed at specialists that are now
    # merged into msbuild, so they name msbuild's binlog-generation and AP-22/AP-23 references, and
    # the capture instruction is a checked fact. Its publish-on-build fix carries msbuild's AP-22
    # caveat, which it links to: an explicit publish comes first, the private-flag pattern is not a
    # universal repair and can hit MSB4006 through `dotnet msbuild -t:Publish`, and a build-order
    # reference schedules the producer's build, not its Publish. A lock held by a running process,
    # such as an Aspire AppHost, is not a path clash: the process stops first. Upstream's shorter
    # description flows; it names find-repeated-work-within-one-build, which ships. Its text-log
    # fallback runs when the binlog server is unavailable or a call fails, the Module's server-first
    # rule. Its closing "clean and rebuild" now verifies in a disposable copy or cleans only
    # user-approved outputs, and the confirming build deletes nothing, as msbuild's repair rule says,

# Sources: dotnet-skills (Aaronontheweb) + dotnet-agent-skills (dotnet/skills) —
# language/API design, application architecture, persistence/configuration,
# project/package/build, testing, diagnostics/performance.
#
# Corpus-first curation: every product-facing item in general's scope has an
# answer below — taken or excluded with the why beside it. Akka and Aspire items of
# dotnet-skills are NOT listed: they are candidates of their own manifests, not
# rejects of this one.
#
# Invocation rule applied module-wide (curator's call): knowledge and report-only
# audits are `auto` — their descriptions honestly name the work, so model selection
# is permitted. Repo/system-mutating ceremonies are `manual`:
# the curator starts them by name, the model never does. `both` is reserved for
# report-only items the curator also types by habit (slopwatch, the perf audit) and
# the one repair flow the model should reach on its exact error (dotnet-devcert-trust).
# The one agent kept is a genuine specialist.
#
# Reference posture: .NET upstream bodies usually point at sibling skills by bare name ("see the
# `filter-syntax` skill") — candidate-tier by ADR-0008, never build state merely because a body is
# patched. An upstream-authored namespaced fact is retained only when its curated target exists and
# is declared with exact `depends_on`. A load form (Load `x`, Use the `x` skill, Invoke `x`) is a
# handoff template, so it is authored as a namespaced fact with its `depends_on`; a "see" mention
# stays a candidate. The reference husks (filter-syntax and test-analysis-extensions) are taken
# `auto`: model loads them by name, users never see them. That matches their upstream
# user-invocable:false + disable-model-invocation:true "neither" class.
# platform-detection is now a bounded identification specialist upstream; this repo keeps it
# model-reachable and lets that narrower selection surface flow.
plugin:
  name: deniz-dotnet-general
  description: "Deniz's curated general .NET skills"
  version: 0.11.1
items:
  # --- language & API design ---
  - source: dotnet-skills/skills/csharp-coding-standards
    invocation: auto # the module's spine; passive C# convention knowledge. Tolerated upstream
    # content inconsistency: the Result-type summary now prefers a domain-specific result type, while
    # the DO list, the Code Organization example, and performance-and-api-design.md still use a
    # generic Result<T, TError> — runtime content, flows as shipped
  - source: dotnet-skills/skills/csharp-nullable-reference-types
    invocation: auto # passive NRT semantics for writing and review where nullable context is already
    # enabled. Project/solution adoption and systematic CS86xx cleanup remain the existing manual
    # migrate-nullable-references ceremony, so the two items do not trigger-compete.
    omit: [nrt-migration-playbook-reference.md] # adoption procedure belongs to the manual ceremony
    frontmatter:
      description: "Apply C# nullable-reference-type semantics where nullable context is already enabled: null-state flow, T? and !, API contracts, System.Diagnostics.CodeAnalysis nullable attributes, and gated C# 14 field-backed-property analysis. USE FOR: writing, refactoring, or reviewing nullable-aware C#. DO NOT USE FOR: enabling NRT across an existing project, systematic CS86xx cleanup, or migration planning; the user invokes migrate-nullable-references separately."
    body: patch # removes migration activation and the omitted playbook links, preserving passive
    # flow/API/attribute knowledge and a user pointer to the manual migration ceremony
  - source: dotnet-skills/skills/aot-trimming
    invocation: auto # passive trimming/AOT design and attribute knowledge for code being written,
    # refactored, or reviewed where trim/AOT analysis is in effect. Enabling it across an existing
    # project and systematic IL-warning cleanup remain the manual dotnet-aot-compat ceremony, the
    # same pairing as nullable reference types, so the two items do not trigger-compete. No omit:
    # unlike the NRT playbook, this playbook is design knowledge that only this item carries.
    body: patch # rescopes the description and When to Use to code in scope, adds a user pointer to
    # the manual ceremony, lets only a new project declare the trim/AOT properties, states that the
    # ceremony's no-suppression rule governs inside it and a justified leaf suppression is allowed
    # outside it, and removes the warning-approval baseline, which moved into dotnet-aot-compat. The
    # serialization see-also stays candidate prose.
  - source: dotnet-skills/skills/csharp-api-design
    invocation: auto # extend-only public API + wire compatibility; the NuGet/distributed side of design
  - source: dotnet-skills/skills/csharp-concurrency-patterns
    invocation: auto # the concurrency chooser; its Akka/R3 handoffs land on r3-reactive-extensions (taken) and the akka module (its own session)
  - source: dotnet-skills/skills/r3-reactive-extensions
    invocation: auto # distinctive, current (R3 1.3.1-pinned), well-bounded
  - source: dotnet-skills/skills/serialization
    invocation: auto # format selection + wire evolution; some factual soft spots are upstream's runtime content, left flowing
  - source: dotnet-skills/agents/roslyn-incremental-generator-specialist.md
    # the one persona worth keeping: deep IIncrementalGenerator pipeline discipline with no skill
    # equivalent anywhere in the corpus. Stays an agent in both trees.
  # --- application architecture / persistence / configuration ---
  - source: dotnet-skills/skills/microsoft-extensions-dependency-injection

# Sources: dotnet-skills (Aaronontheweb) + dotnet-agent-skills (dotnet/skills) —
# language/API design, application architecture, persistence/configuration,
# project/package/build, testing, diagnostics/performance.
#
# Corpus-first curation: every product-facing item in general's scope has an
# answer below — taken or excluded with the why beside it. Akka and Aspire items of
# dotnet-skills are NOT listed: they are candidates of their own manifests, not
# rejects of this one.
#
# Invocation rule applied module-wide (curator's call): knowledge and report-only
# audits are `auto` — their descriptions honestly name the work, so model selection
# is permitted. Repo/system-mutating ceremonies are `manual`:
# the curator starts them by name, the model never does. `both` is reserved for
# report-only items the curator also types by habit (slopwatch, the perf audit) and
# the one repair flow the model should reach on its exact error (dotnet-devcert-trust).
# The one agent kept is a genuine specialist.
#
# Reference posture: .NET upstream bodies usually point at sibling skills by bare name ("see the
# `filter-syntax` skill") — candidate-tier by ADR-0008, never build state merely because a body is
# patched. An upstream-authored namespaced fact is retained only when its curated target exists and
# is declared with exact `depends_on`. A load form (Load `x`, Use the `x` skill, Invoke `x`) is a
# handoff template, so it is authored as a namespaced fact with its `depends_on`; a "see" mention
# stays a candidate. The reference husks (filter-syntax and test-analysis-extensions) are taken
# `auto`, and their consumers load them through checked facts. Upstream marks them reference-only
# (disable-model-invocation: true) and tells each consumer to read the file from a "caller-provided
# or runtime-listed catalog" and never invoke it; no harness supplies such a catalog, so this estate
# keeps the husks model-loadable against that stance and the consumer patches drop the
# "do not invoke" text. Reading them by relative path instead would buy nothing over facts.
# platform-detection is now a bounded identification specialist upstream; this repo keeps it
# model-reachable and lets that narrower selection surface flow.
plugin:
  name: deniz-dotnet-general
  description: "Deniz's curated general .NET skills"
  version: 0.13.0
items:
  # --- language & API design ---
  - source: dotnet-skills/skills/csharp-coding-standards
    invocation: auto # the module's spine; passive C# convention knowledge. Tolerated upstream
    # content inconsistency: the Result-type summary now prefers a domain-specific result type, while
    # the DO list, the Code Organization example, and performance-and-api-design.md still use a
    # generic Result<T, TError> — runtime content, flows as shipped
    body: patch # one boundary sentence, curator's call: its When to Use claims refactoring existing
    # code, while its record and value-object preferences change equality and copying, so a
    # behavior-preserving "modernize" goes to csharp-refactoring, which applies only the idioms the
    # repository's analyzers enforce
    depends_on: [csharp-refactoring] # the boundary sentence names it as a checked fact
  - source: dotnet-skills/skills/csharp-nullable-reference-types
    invocation: auto # passive NRT semantics for writing and review where nullable context is already
    # enabled. Project/solution adoption and systematic CS86xx cleanup remain the existing manual
    # migrate-nullable-references ceremony, so the two items do not trigger-compete.
    omit: [nrt-migration-playbook-reference.md] # adoption procedure belongs to the manual ceremony
    frontmatter:
      description: "Apply C# nullable-reference-type semantics where nullable context is already enabled: null-state flow, T? and !, API contracts, System.Diagnostics.CodeAnalysis nullable attributes, and gated C# 14 field-backed-property analysis. USE FOR: writing, refactoring, or reviewing nullable-aware C#. DO NOT USE FOR: enabling NRT across an existing project, systematic CS86xx cleanup, or migration planning; the user invokes migrate-nullable-references separately."
    body: patch # removes migration activation and the omitted playbook links, preserving passive
    # flow/API/attribute knowledge and a user pointer to the manual migration ceremony
  - source: dotnet-skills/skills/aot-trimming
    invocation: auto # passive trimming/AOT design and attribute knowledge for code being written,
    # refactored, or reviewed where trim/AOT analysis is in effect, and the owner of turning on both
    # PublishAot and PublishTrimmed in an app, new or existing, curator's call: the manual ceremony
    # sets only IsAotCompatible and disclaims publishing, so routing that request to it left no item
    # to do it. Adopting IsTrimmable/IsAotCompatible in an existing library and the systematic
    # migration of a project-wide IL-warning list remain the manual dotnet-aot-compat ceremony; this
    # item keeps only the warnings the code being written or changed raises, so a model choosing it
    # does not take over a migration. No omit: unlike the NRT playbook, this playbook is design
    # knowledge that only this item carries.
    body: patch # rescopes When to Use to code in scope and an app's publish switch, adds a user
    # pointer to the manual ceremony, lets only a new library declare the library properties, states
    # that the ceremony's no-suppression rule governs inside it and a justified leaf suppression is
    # allowed outside it, and removes the warning-approval baseline, which moved into
    # dotnet-aot-compat. The description stays short so that a skill-listing budget keeps its
    # boundaries: it opens with the app publish switch, states the ceremony's exclusion within its
    # first 130 characters, and keeps the existing-library and in-code-warning qualifiers, which is
    # why it runs a little over the roadmap's 190. It drops upstream's attribute and pattern list,
    # which the body carries, and its serialization see-also; the playbook keeps its System.Text.Json
    # source-generation section.
  - source: dotnet-skills/skills/csharp-api-design
    invocation: auto # extend-only public API + wire compatibility; the NuGet/distributed side of design
  - source: dotnet-skills/skills/csharp-concurrency-patterns
    invocation: auto # the concurrency chooser; its Akka/R3 handoffs land on r3-reactive-extensions (taken) and the akka module (its own session)
  - source: dotnet-skills/skills/r3-reactive-extensions
    invocation: auto # distinctive, current (R3 1.3.1-pinned), well-bounded
  - source: dotnet-skills/skills/serialization
    invocation: auto # format selection + wire evolution; some factual soft spots are upstream's runtime content, left flowing
  - source: dotnet-agent-skills/plugins/dotnet/skills/csharp-refactoring
    invocation: both # behavior-preserving refactoring discipline: build and test before and after,
    # scaled to the change. Nothing else taken does this job: modern-csharp-coding-standards says what
    # to write and deniz-process:codebase-design what shape to aim for, this item how to change code
    # without changing behavior. Upstream's broad "any refactor" trigger stays; the curator also
    # starts it by hand
    body: patch # its stop rule pointed at upgrade, feature, and API-contract workflows this estate
    # does not have, so a request outside behavior-preserving refactoring is stated as such and then
    # continued as ordinary work when it clearly asks for it, or asked about once. It also names a
    # generic C# language server instead of upstream's plugin LSP, drops the dotnet-upgrade route,
    # resolves the baseline and pass-count contradiction and the duplicated on-red sentence, and turns
    # the catalog's nullable pointer into a user pointer to the manual migrate-nullable-references.
    # The catalog's "Modernize" section adds one boundary sentence, curator's call: converting to a
    # record or a readonly record struct, which modern-csharp-coding-standards prefers for new code,
    # changes equality, copying, and ToString, so it is not a modernize step here
    depends_on: [modern-csharp-coding-standards] # the boundary sentence names it as a checked fact
  - source: dotnet-skills/agents/roslyn-incremental-generator-specialist.md
    # the one persona worth keeping: deep IIncrementalGenerator pipeline discipline with no skill
    # equivalent anywhere in the corpus. An agent in Claude Code and OpenCode; Codex emits it as a
    # skill, as it does every agent.
  # --- application architecture / persistence / configuration ---
  - source: dotnet-skills/skills/microsoft-extensions-dependency-injection
    invocation: auto # feature-registration composition root patterns
  - source: dotnet-skills/skills/microsoft-extensions-configuration
    invocation: auto # Options/IValidateOptions/ValidateOnStart — clean, current
  - source: dotnet-skills/skills/efcore-patterns
    invocation: auto # EF usage patterns: tracking, migrations, split queries
    body: patch # absorbs the EF-Core-specific half of the excluded optimizing-ef-core-queries:
    # EF.CompileQuery on a hot path, framed as the last thing to try rather than the first
    merged_from: [dotnet-agent-skills/plugins/dotnet-data/skills/optimizing-ef-core-queries]
  - source: dotnet-skills/skills/database-performance
    invocation: auto # data-access architecture/perf — a different job from efcore-patterns despite the overlap; merging costs more than it saves
    body: patch # absorbs the SQL-level half of the excluded optimizing-ef-core-queries: predicate
    # sargability and keyset pagination. Both are engine-level rather than EF-level — the same
    # predicate written in Dapper scans for the same reason — so this skill, which already spans
    # EF Core and Dapper and already teaches offset paging, is where they belong. Provider-specific
    # expression-index exceptions are upstream factual detail, not set-level placement or dependency

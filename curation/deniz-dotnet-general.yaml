  - source: dotnet-skills/skills/microsoft-extensions-dependency-injection
    invocation: auto # feature-registration composition root patterns
  - source: dotnet-skills/skills/microsoft-extensions-configuration
    invocation: auto # Options/IValidateOptions/ValidateOnStart — clean, current
  - source: dotnet-skills/skills/efcore-patterns
    invocation: auto # EF usage patterns: tracking, migrations, split queries
    body: patch # absorbs the EF-Core-specific half of the excluded optimizing-ef-core-queries:
    # EF.CompileQuery on a hot path, framed as the last thing to try rather than the first, in
    # upstream's corrected wording (EF Core already caches translation, so a compiled delegate only
    # skips the lookup; EF Core 9 rejects EF.Parameter and EF.Constant inside one). Pattern 5 carries
    # upstream's ExecuteUpdate/ExecuteDelete caveats: stale tracked values, unchecked concurrency
    # tokens, no atomicity with SaveChanges, and bypassed SaveChanges hooks
    merged_from: [dotnet-agent-skills/plugins/dotnet-data/skills/optimizing-ef-core-queries]
  - source: dotnet-skills/skills/database-performance
    invocation: auto # data-access architecture/perf — a different job from efcore-patterns despite the overlap; merging costs more than it saves
    body: patch # absorbs the SQL-level half of the excluded optimizing-ef-core-queries: predicate
    # sargability and keyset pagination. Both are engine-level rather than EF-level — the same
    # predicate written in Dapper scans for the same reason — so this skill, which already spans
    # EF Core and Dapper and already teaches offset paging, is where they belong. The imported text
    # follows upstream's corrections: no full-table-scan claim from LINQ alone, an untranslatable
    # predicate throws rather than running on the client, full-text search is no drop-in for
    # substring matching, and a composite keyset cursor needs a lexicographic predicate. Provider-specific
    # expression-index exceptions are upstream factual detail, not set-level placement or dependency
    # debt, so this curation does not expand the imported section to teach them.
    merged_from: [dotnet-agent-skills/plugins/dotnet-data/skills/optimizing-ef-core-queries]
  - source: dotnet-skills/skills/opentelementry-dotnet-instrumentation
    invocation: auto # the estate's one OpenTelemetry item: manual instrumentation
    # (Activities/metrics/logs) and SDK setup. Upstream dotnet/skills deleted its setup skill,
    # configuring-opentelemetry-dotnet (dotnet/skills#1210), which this item used to complement; its
    # SDK reference already carries the OTLP exporter setup, the health-check span filter, and the
    # 4317/4318 port fact, so only the single UseOtlpExporter() call is lost.
    # Tolerated upstream example defect: the dependency-free exception callback computes EmitLogs
    # but invokes the callback unconditionally in the spans-only default. This is local runtime
    # guidance, not set wiring or harness fit; opening ownership on its 770-line reference file costs
    # more than this curation owes, so that reference continues to flow upstream-owned.
    body: patch # one guard in SKILL.md, curator's call: its setup adds a per-signal AddOtlpExporter(),
    # and beside the UseOtlpExporter() that Aspire's ServiceDefaults calls once the AppHost sets the
    # OTLP endpoint, OpenTelemetry .NET throws NotSupportedException, so the service fails at startup
    # only under the AppHost. Where a composition root already calls UseOtlpExporter(), sources and
    # meters are registered there and no exporter is added. Plain text, no cross-Module edge
  - source: dotnet-agent-skills/plugins/dotnet-aspnetcore/skills/dotnet-webapi
    invocation: auto # HTTP semantics/endpoints — complementary to api-design's library/wire focus
    body: patch # EF handoff pointed at the excluded optimizing-ef-core-queries; rewired to the two
    # kept homes with bare references
  - source: dotnet-agent-skills/plugins/dotnet-advanced/skills/csharp-scripts
    invocation: auto # file-based C# apps (.NET 10+) — prototype/spike knowledge
  - source: dotnet-agent-skills/plugins/dotnet-advanced/skills/dotnet-pinvoke
    invocation: auto # P/Invoke + LibraryImport specialist reference; rare but exactly-when-needed
  - source: dotnet-agent-skills/plugins/dotnet11/skills/process-api-net11
    invocation: auto # curator's call, taken without waiting for .NET 11 GA: the new System.Diagnostics.Process APIs
    # (Process.Run, RunAndCaptureText, StartAndForget, KillOnParentExit, InheritedHandles,
    # StartDetached) are BCL knowledge no other item carries; csharp-15 covers the language, not the
    # library. Its siblings system-text-json-net11 and migrate-dotnet10-to-dotnet11 stay excluded
  - source: dotnet-agent-skills/plugins/dotnet-advanced/skills/vectorization
    invocation: auto # official SIMD authoring/review knowledge: contract preservation, portable
    # Vector128-first implementation, tail/memory safety, fallbacks, and measurement. Its bounded
    # SIMD trigger complements the general performance audit and BenchmarkDotNet guidance.
  # --- project / package / build ---
  - source: dotnet-skills/skills/project-structure
    invocation: auto # the curator's opinionated repo layout (slnx, Directory.Build.props, CPM, SourceLink, global.json)
    body: patch # its CPM setup converted an existing solution inline; a new solution may still start
    # with Directory.Packages.props, but converting existing projects points the user at the manual
    # convert-to-cpm ceremony, as directory-build-organization's patch does: a repository-mutating
    # conversion never runs on the model's initiative. An existing Directory.Packages.props stays in
    # scope for its placement and layering
  - source: dotnet-skills/skills/package-management
    invocation: auto # daily CPM/NuGet CLI discipline; its "never edit XML" absolutism is upstream content, tolerated
    body: patch # its "Enable CPM" section converted an existing solution inline; a new solution may
    # still start with Directory.Packages.props, but converting existing projects points the user at
    # the manual convert-to-cpm ceremony, as directory-build-organization's patch does. An existing
    # Directory.Packages.props stays in scope for its placement and layering
  - source: dotnet-skills/skills/local-tools
    invocation: auto # dotnet-tools.json manifest discipline; pairs with project-structure
  - source: dotnet-skills/skills/sdk-container-publishing
    invocation: auto # SDK-built container images (PublishContainer and the Container* properties) and
    # their CI publish step; no other item carries this knowledge, and aspire-deployment covers only
    # images deployed through an Aspire AppHost
    # references/real-world-examples.md ships, curator's call: its worked csproj, CI, and
    # Directory.Build.props examples back the body's centralized-settings link, which keeps
    # upstream's target
    body: patch # adds only what upstream never had: an external-action guard, a checked fact to
    # aot-trimming, which turns PublishAot on, and a short description that names the use and then
    # its exclusions, the PublishAot route to aot-trimming first, within its first 130 characters, so
    # a skill-listing budget keeps them. Dockerfile builds, Aspire AppHost deploys, and containers
    # in tests stay excluded; to fit about 190 characters the description no longer names
    # aspire-deployment or testcontainers-integration-tests, whose own descriptions claim that
    # work, and the Related Skills fact still names the latter. The defects this patch used to
    # correct were reported from this curation (Aaronontheweb/dotnet-skills#93) and fixed upstream
    # in v1.7.1 (#94): CONTAINER2008 between the csproj tag list and the CI tag flag, the
    # VersionPrefix order that tags a plain publish only `latest`, the `latest` default dating from
    # .NET 8, the scope of ContainerPublishInParallel, the daemon claim for a registry push, the dead
    # registry-auth link, the deprecated ContainerEntrypoint and the missing ContainerDefaultArgs,
    # `docker login -p`, the multi-target entry, the unquoted RID lists, and authoring residue. Each
    # fix was checked against Microsoft Learn and the dotnet/sdk source, so upstream's text now flows
    # in their place
    depends_on: [testcontainers-integration-tests, aot-trimming] # its Related Skills facts stay checked
  - source: dotnet-agent-skills/plugins/dotnet-nuget/skills/convert-to-cpm
    invocation: manual # one-shot repo-mutating conversion ceremony — the curator types it
  # The MSBuild estate (curator's call): Microsoft's own MSBuild-team content, taken as knowledge.
  # Upstream's consolidated `msbuild` skill is the one auto entry for build failures, build
  # performance, and authoring review; its bundled references are corrected copies of nine former
  # specialists, which are excluded below as merged into it. Ten narrow specialists stay beside it,
  # and its routing rows reach each of them as a checked fact; troubleshoot-binlog-mcp, a manual
  # repair ceremony, is outside that set. Router/review agents are excluded: their value is
  # orchestration glue that none of the three harness outputs preserves.
  # This repository ships and registers no MCP servers. Upstream registers the BinlogMcp server at
  # its plugin level (an auto-downloaded prerelease), and that registration does not travel with
  # curated items; a host that registers a `binlog` server itself, as the curator's estate does at
  # user level, gets it. Bodies use a connected server first and keep the text-log replay path for a
  # host without one or a call that fails. A claim that the server is bundled with the plugin is
  # false where a body lands and is patched out.
  - source: dotnet-agent-skills/plugins/dotnet/skills/msbuild
    invocation: auto # the consolidated entry: troubleshooting, performance, and authoring review, each
    # reading only its relevant bundled reference. Upstream wrote it replay-only; the patch adds a
    # binlog-server step ahead of replay, which stays the fallback
    body: patch # its "do not load the original plugin's skills" rule would fence off the ten kept
    # specialists, so it is rewritten to route to them, and routing rows reach each one as a checked
    # fact. Its binlog-failure-analysis reference opens the replay section with one paragraph: query a
    # connected binlog MCP server first, replay when none is connected or a call fails, and replay as
    # the cross-check; the failure routing row and the shared-evidence rule say the same ("first,
    # else"), and build-perf-diagnostics' replay step queries a connected server first, so no entry
    # point skips a connected server; its text-log recipes run only on a replayed log, so after a
    # server answer the model uses the server's queries or replays as well. That paragraph also tells the user, when a registered server
    # fails to start or connect, that they can run the manual troubleshoot-binlog-mcp, and analysis
    # goes on with replay: a user pointer, so MCP-3's manual posture holds. It also
    # carries what its bundled copies lost against the specialists they replace: the
    # analyzer-evidence step (ReportAnalyzer) and the no-universal-thresholds rule in
    # build-perf-baseline, whose 5s/30s no-op hints it drops; that rule reads build-perf-diagnostics'
    # seconds and percentages as starting hints for where to look, not pass/fail thresholds, so the
    # two references agree. It also carries the AP-11 exception from the excluded
    # msbuild-quality-reviewer agent (message-only, validation, orchestration, and intentionally
    # always-running targets need no Inputs/Outputs). It restores the merged msbuild-antipatterns'
    # contract that a review only reports unless fixes are asked for, because "review this .csproj"
    # now auto-loads an entry whose route reads as improvement. Its description is our own, curator's
    # call: upstream's newer text claims every project-file edit and custom-target repairs, which
    # compete with property-patterns, item-management, directory-build-organization,
    # package-management, and target-authoring. Ours claims custom targets that rerun, skip, or leave
    # stale outputs, the diagnosis, and its target-authoring row takes the Inputs/Outputs fix
    depends_on:
      - check-bin-obj-clash
      - build-parallelism
      - target-authoring
      - property-patterns
      - item-management
      - including-generated-files
      - directory-build-organization
      - msbuild-modernization
      - find-repeated-work-within-one-build
      - eliminate-redundant-restores
  - source: dotnet-agent-skills/plugins/dotnet-msbuild/skills/msbuild-antipatterns
    exclude: true # merged into msbuild: its references/msbuild-antipatterns.md and the AP-16 to AP-23
    # catalog carry the review entry point, with upstream's later corrections
  - source: dotnet-agent-skills/plugins/dotnet-msbuild/skills/directory-build-organization
    invocation: auto # Directory.Build.* mechanics — deeper on evaluation order than project-structure.
    # Its TFM-in-.props pitfall overlaps property-patterns; that fuzzy split is left as upstream drew it
    body: patch # its workflow step that converted the repository to Central Package Management now
    # points the user at the manual convert-to-cpm ceremony: a repository-mutating conversion never
    # runs on the model's initiative. The CPM section's "Enable CPM" imperative heading now labels its
    # example as the shape of the file, which stays in scope for placement and layering. The linked
    # before/after example in references/multi-level-examples.md turned versioned projects into a CPM
    # setup, so its after-state is captioned as the shape after the user has run convert-to-cpm, with
    # each Version= kept without that conversion
  - source: dotnet-agent-skills/plugins/dotnet-msbuild/skills/property-patterns
    invocation: auto
  - source: dotnet-agent-skills/plugins/dotnet-msbuild/skills/item-management
    invocation: auto
  - source: dotnet-agent-skills/plugins/dotnet-msbuild/skills/target-authoring
    invocation: auto
    body: patch # upstream's description routes incremental-build and msbuild-antipatterns, which are
    # merged into msbuild here, so the patched description routes both jobs to msbuild in its DO NOT
    # USE list. Inputs/Outputs had two owners, curator's call to split them: this item writes a
    # target's Inputs/Outputs, and msbuild finds why a target reruns or skips. Its description says

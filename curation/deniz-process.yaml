# Intended sources: all 14 Superpowers skills, 22 direct Matt Pocock skills, three Matt merge
# sources, and the ASD-STE100 root skill. The result is a personal transformation, not either
# upstream framework wholesale: overlapping TDD, debugging, and review material is merged; ten Matt
# items are excluded; no upstream hooks ship; triggers are tuned per item.
#
# Batch 1: the daily-flow spine — brainstorm/grill → plan →
# execute → review/verify — plus the passive disciplines. Invocation rule that shaped it:
# `manual` is unreachable even from another skill's body, so every link another taken skill
# invokes is `both` or `auto`; only true entry points are `manual`.
#
# Batch 2 closes the module: the selected Matt production chain, with its runtime setup behavior
# preserved but dead harness metadata omitted, plus the authoring pair and Superpowers' last two.
#
# Both merge passes have landed — the TDD mix (superpowers test-driven-development × matt tdd,
# which also repointed implement's two bare slash references) and the review mix
# (requesting-code-review × matt code-review). Every source item in both upstreams' promoted sets
# now has an answer here: taken, merged, or excluded with the reason beside it.
plugin:
  name: deniz-process
  description: "Deniz's curated process skills (brainstorming, planning, debugging)"
  version: 0.4.1
items:
  # --- superpowers spine: brainstorm → plan → execute → finish ---
  - source: superpowers/skills/brainstorming
    invocation: both # curator's call: reachable both ways — typed by hand, and a
    # skill-driven session may open the ceremony itself (using-superpowers routes "build X" here);
    # its exit invokes writing-plans (taken). Measured before flipping: the only jump-pressure was
    # the upstream description (overridden below); the body's one "You MUST" is in-ceremony
    # discipline and stays.
    frontmatter:
      # replaces upstream's coercive trigger prose ("You MUST use this before any creative work");
      # read by a human browsing the / menu and by the model matching triggers — honest, no pressure.
      # Names all three upstream paths: the earlier wording promised a spec, which only the
      # architectural path produces — spike answers a question and bounded designs in chat.
      description: "Collaborative design session, scaled to the task: a feasibility answer, a short in-chat design, or a full written design and spec — each one ending in approval before implementation."
  - source: superpowers/skills/writing-plans
    invocation: both # typed directly ("spec ve plan yazdır"), and brainstorming's exit invokes it — manual would break the chain
    depends_on: [executing-plans, subagent-driven-development, using-git-worktrees] # the handoff menu offers both executors; worktree note in the header
  - source: superpowers/skills/subagent-driven-development
    invocation: both # "subagent'la ilerle" should be reachable by the model mid-conversation, and writing-plans' handoff menu invokes it
    depends_on: [finishing-a-development-branch, requesting-code-review, using-git-worktrees] # end-of-run finish, the reviewer template, worktree setup
  - source: superpowers/skills/executing-plans
    invocation: both # SDD's no-subagent sibling; writing-plans' handoff menu offers both — skipping it would need a body patch for zero gain
    depends_on: [finishing-a-development-branch, subagent-driven-development, using-git-worktrees]
  - source: superpowers/skills/finishing-a-development-branch
    invocation: both # invoked from SDD/executing-plans bodies at the end of every run
  - source: superpowers/skills/using-git-worktrees
    invocation: auto # only ever reached from other skills' bodies or model judgment; asks consent itself before creating anything
  # --- review pair ---
  - source: superpowers/skills/requesting-code-review
    invocation: both # typed as a ceremony ("review since main"), and the model fires it after a task; SDD also uses its code-reviewer.md template (cross-skill file dep)
    # Both files are a merge, curator's call: superpowers brings the dispatch protocol, the
    # severity calibration, the read-only discipline and the output format — the weight is in
    # code-reviewer.md, not the skill. mattpocock code-review brings what superpowers had no word
    # for: a STANDARDS axis with a real rubric (twelve Fowler smells, each a judgement call, the
    # repo's own documented standard overriding), range pinning that fails before a subagent burns
    # context on a bad ref, and spec-source discovery, which is what makes the typed "review since
    # X" use work at all. His two-axis separation is kept as a reporting rule — severity within an
    # axis, never across — because that insight is about masking, not about topology.
    # Topology is the one place we diverge from him: one reviewer by default, two only when the
    # spec is a genuinely separate document. Every review inside subagent-driven-development has
    # the plan AS the requirements, so a second subagent would read one document twice per range,
    # in a skill that already warns its final-review fix wave outcosts all its tasks.
    # code-reviewer.md keeps its name and place: SDD reaches it by relative path from three spots
    # including a flowchart, and validate now guards that (ADR-0008 path tier).
    body: overlay
    merged_from: [mattpocock-skills/skills/engineering/code-review] # same-filename rule suffices — matt ships only a SKILL.md
    depends_on: [receiving-code-review] # taking the feedback is its own discipline, and it is taken
  - source: superpowers/skills/receiving-code-review
    invocation: auto # behavioural discipline that should kick in whenever review feedback arrives — never typed
  # --- passive disciplines ---
  - source: superpowers/skills/test-driven-development
    invocation: auto # invoked from systematic-debugging's body and from implement's
    # Both files are a merge, curator's call: superpowers' discipline (Iron Law, watch-it-fail,
    # the rationalization tables) is the spine, and mattpocock tdd's one idea our set was missing
    # is installed as an organ — the SEAM. Two items we already ship point at the word and had
    # nowhere to send a reader: systematic-debugging Phase 6 ("at a correct seam") and implement
    # ("at pre-agreed seams"). Its second idea, one slice at a time / tracer bullets, names the
    # bulk-tests-first failure superpowers never named. Matt's gate ("no test at an unconfirmed
    # seam, confirm with the user") is kept as a conditional: this item is `auto` and fires
    # unprompted, so an unconditional human round-trip would make a discipline into an interrupt.
    # Refactor stays in the loop for cleanup under green; structural work routes to review, which
    # is where matt put all of it — both are true, so the contradiction dissolves.
    # matt's mocking.md contributes the boundary list superpowers lacked; its SDK-interface advice
    # is design prescription and belongs to codebase-design (taken). tests.md is not drawn from:
    # superpowers' own writing-good-tests.md is denser on the same ground, and its one unique
    # example — verifying around the interface instead of through it — was written fresh.
    # writing-good-tests.md is owned rather than patched because its citation of writing-skills is
    # a dangling model-edge in our set (that target is manual), so the file could not flow pristine.
    body: overlay
    merged_from:
      - source: mattpocock-skills/skills/engineering/tdd
        files: [SKILL.md, mocking.md] # where the merge actually drew from — not the filename rule
    depends_on: [requesting-code-review, systematic-debugging] # structural refactor routes out; bugs route in
    frontmatter:
      # auto item, so the description is the trigger: it now covers the seam and the slice, not
      # just the red-green loop, and an honest trigger line is half of taking the pressure out
      description: "Use when implementing any feature or bugfix, before writing implementation code — the red-green loop, the seam to test at, and one slice at a time"
  - source: superpowers/skills/verification-before-completion
    invocation: auto # fires before any "done" claim; clears the other 2 standing warnings
  - source: superpowers/skills/systematic-debugging
    invocation: auto # debugging discipline should engage when a bug appears, unprompted
    depends_on: [test-driven-development, verification-before-completion] # Phase 6 invokes both
    # SKILL.md is a merge, curator's call: superpowers' root-cause armor + mattpocock
    # diagnosing-bugs' feedback-loop engineering, in seven phases. The overlay covers SKILL.md
    # only, so the sibling technique files keep flowing from upstream; the merge source is
    # blessed below — its drift stops the build exactly like the primary's.
    body: overlay
    merged_from: [mattpocock-skills/skills/engineering/diagnosing-bugs]
    frontmatter:
      # merged skill also covers matt's perf-regression ground, so the trigger names it
      description: "Use when encountering any bug, test failure, performance regression, or unexpected behavior, before proposing fixes"
    omit: # author-facing material shipped alongside the skill (see upstream-repo-layouts.md)
      - CREATION-LOG.md
      - test-academic.md
      - "test-pressure-*.md"
  - source: superpowers/skills/using-superpowers
    invocation: manual # the opt-in "work skill-driven this session" switch — flipped by hand, never a bootstrap hook (ADR-0007)
    # Softened body, curator's call (level ii of three): the "1% chance" coercion
    # block, the Red Flags rationalization table and the Codex/Pi platform section are cut; the
    # ordering rule (process skills before implementation), the announce habit and the subagent
    # guard stay. It is invoked by hand, so the persuasion apparatus has no one left to persuade.
    body: patch
    depends_on: [brainstorming, systematic-debugging] # the ordering rule's two worked examples route to them
    frontmatter:
      # manual → the description's only reader is a human browsing the menu
      description: "Switch this session to skill-driven working: check for a relevant skill before each task, process skills first."
    omit: ["references/**"] # codex/pi/antigravity/gemini tool maps — dead in both target harnesses
  # --- mattpocock grilling core ---
  # All matt items omit agents/** — every matt skill bundles an agents/openai.yaml, which is
  # Codex/OpenAI harness config; dead weight in both of our target harnesses.
  - source: mattpocock-skills/skills/productivity/grill-me
    invocation: manual # 7-line trigger whose whole body is "Run a /grilling session" — the composition pattern's cleanest example
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/productivity/grilling
    invocation: auto # the knowledge grill-me/grill-with-docs invoke; upstream marks it model-invoked for exactly this reason
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/grill-with-docs
    invocation: manual # stateful grill (CONTEXT.md + ADRs); entry point, drags domain-modeling (taken)
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/domain-modeling
    invocation: auto # vocabulary layer grill-with-docs drives; other skills reach it by name
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/productivity/handoff
    invocation: manual # small, dependency-free, immediately useful session bridge
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/diagnosing-bugs
    exclude: true # not rejected — merged: its feedback-loop phases live inside the
    # systematic-debugging overlay; taking it as well would put two auto debugging
    # skills in trigger competition
  # --- mattpocock production chain (batch 2) ---
  - source: mattpocock-skills/skills/engineering/to-spec
    invocation: manual # upstream's own flag; conversation → spec ceremony
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/to-tickets
    invocation: manual # upstream's own flag; spec → tracer-bullet tickets
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/triage
    invocation: manual # upstream's own flag; issue-tracker state machine
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/wayfinder
    invocation: manual # upstream's own flag; the heaviest ceremony — decision maps for foggy efforts
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/implement
    invocation: manual # upstream's own flag; the ceremony that opens an implementation run
    # Two-line patch, curator's call: upstream's bare `/tdd` and `/code-review` are matt's own
    # convention for "the model invokes this", which collides with our grammar where a slash means
    # the human is the audience — and both targets are model-reachable here, so a pointer would
    # not even link. Repointed to neutral-space model-edges; each tree localizes them.
    body: patch
    depends_on: [requesting-code-review, test-driven-development]
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/setup-matt-pocock-skills
    invocation: manual # curator's call: the wizard comes too — useful, harmless, pure runtime
    omit: ["agents/**"]
  # --- mattpocock design & standalone (batch 2) ---
  - source: mattpocock-skills/skills/engineering/codebase-design
    invocation: auto # a glossary other skills pull in, not a ceremony — `both` was floated, flipping is one word if typing it ever feels natural
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/improve-codebase-architecture
    invocation: manual # upstream's own flag; spare-moment architecture survey
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/research
    invocation: both # curator's call: "şunu araştır" is as natural typed as model-delegated
    # First cross-framework stitch, curator's idea: the background-agent dispatch is crafted per
    # superpowers' dispatching-parallel-agents — one-line patch, namespaced so each tree localizes it
    body: patch
    depends_on: [dispatching-parallel-agents] # the stitch above
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/prototype
    invocation: both # curator's call: a deliberate "bir prototip yap" is as real as the model reaching for it
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/resolving-merge-conflicts
    invocation: auto # the trigger is the situation (an in-progress conflict), not a wish
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/productivity/teach
    invocation: manual # upstream's own flag; stateful learning workspace, wanted around
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/productivity/writing-for-agents
    invocation: manual # curator's call now, not upstream's flag: upstream deleted writing-great-skills,
    # rewrote it under this name, broadened it from skills to any agent-consumed document, and dropped
    # its disable-model-invocation. Its new trigger fires on "modifying AGENTS.md or CLAUDE.md", which
    # is ordinary canon work in this repo, so the trigger stays in the curator's hand. Still the
    # complement, not the substitute, of writing-skills: that one is a TDD-for-skills testing
    # methodology, this one is the design vocabulary — and both being manual, neither competes.
    omit: ["agents/**"]
  - source: asd-ste100
    invocation: auto # passive controlled-English rewrite knowledge and wait-what's model-reachable
    # handoff target. This single-purpose root-skill repo stays a submodule so pin drift reaches the
    # normal sync review machinery instead of becoming an untracked original-skill fork.
    omit: [README.md] # installation prose with stale examples is not a runtime asset; the compiler
    # drops submodule git metadata from every source tree before item-specific omission
  - source: mattpocock-skills/skills/productivity/wait-what
    invocation: manual # upstream's own flag, and the right one: a mid-conversation corrective typed
    # when a message did not land. Its STE request now loads the curated rules rather than naming a
    # standard with nothing behind it; CONTEXT.md remains the second half of the repitch.
    body: patch
    depends_on: [asd-ste100]
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/productivity/to-questionnaire
    invocation: manual # upstream's own flag; graduated out of in-progress. Dependency-free and the
    # inverse of grill-me: it interviews about the recipient rather than the subject, then aims the
    # questions at the gap. Feeds grill-with-docs and to-spec, both taken.
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/wizard
    invocation: manual # curator's call, diverging from upstream: it graduated out of in-progress AS a
    # model-invoked skill, and its trigger ("provisioning infrastructure, setting up credentials or CI
    # secrets") would let the model reach for a credential-writing script generator on its own. The
    # generated script writes plaintext .env values and runs `gh secret set` against a real repo, so
    # the human pulls this trigger. template.sh is deliberately NOT omitted: the body's central
    # instruction is to copy it and never hand-edit it, so omitting it would break the skill.
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/code-review
    exclude: true # not rejected — merged: the standards axis, the smell baseline, the range
    # pinning and the spec discovery all live inside the requesting-code-review overlay. Taking it
    # as well would give the model two review skills whose triggers overlap almost exactly.
  - source: mattpocock-skills/skills/engineering/tdd
    exclude: true # not rejected — merged: the seam and the one-slice rule live inside the
    # test-driven-development overlay. Taking it as well would put two auto TDD skills in trigger
    # competition, the same reason diagnosing-bugs is excluded above.
  - source: mattpocock-skills/skills/engineering/ask-matt
    name: ask-deniz # it is a map of THIS module, so it carries this module's name
    invocation: manual # you ask it; it never volunteers
    body: overlay # a router is the one artifact selection alone cannot curate. Upstream maps
    # upstream's own set, so every name in it is either right by luck or wrong on arrival: tdd,
    # code-review and diagnosing-bugs are merged away here, half this module is superpowers, and
    # /clear and /compact are Claude-only spellings. The shape is upstream's and worth keeping — main
    # flow, on-ramps, vocabulary underneath, phase boundaries — the routing is ours.
    # Stateful routing names only qualifying vocabulary and decisions because domain-modeling creates
    # CONTEXT.md and ADRs lazily; the router must not promise files that the delegated skill may skip.
    omit: ["agents/**"]
  # --- superpowers, the last two (batch 2) ---
  # --- mattpocock components read and rejected, kept visible so a pin move does not re-raise them ---
  - source: mattpocock-skills/skills/in-progress/loop-me
    exclude: true # spec-grilling wrapper over grilling (taken); the grill entry points already cover it
  - source: mattpocock-skills/skills/in-progress/setup-ts-deep-modules
    exclude: true # wires dependency-cruiser into a TS repo; a one-off setup for a boundary discipline
    # this estate does not run
  - source: mattpocock-skills/skills/in-progress/writing-fragments
    exclude: true # article-writing hat trick (explore); this module writes canon, not articles
  - source: mattpocock-skills/skills/in-progress/writing-shape
    exclude: true # article-writing hat trick (shape) — same reason as writing-fragments
  - source: mattpocock-skills/skills/in-progress/writing-beats
    exclude: true # article-writing hat trick (exploit) — same reason as writing-fragments
  - source: mattpocock-skills/skills/in-progress/claude-handoff
    exclude: true # overlaps the taken handoff, and its name binds it to one harness
  - source: mattpocock-skills/skills/misc/git-guardrails-claude-code
    exclude: true # installs Claude Code hooks; harness-specific setup with no OpenCode equivalent,
    # and hook installation is deliberately off here (hooks.include stays empty)
  - source: mattpocock-skills/skills/misc/migrate-to-shoehorn
    exclude: true # test migration bound to one library (@total-typescript/shoehorn)
  - source: mattpocock-skills/skills/misc/scaffold-exercises
    exclude: true # scaffolds course exercise directories — upstream author's own teaching workflow
  - source: mattpocock-skills/skills/misc/setup-pre-commit
    exclude: true # installs Husky + lint-staged + Prettier; this estate formats with Biome
  - source: superpowers/skills/dispatching-parallel-agents
    invocation: auto # dependency-free dispatch knowledge; research's stitch points at it
  - source: superpowers/skills/writing-skills
    invocation: manual # authoring ceremony, opened by hand — its body then reaches the two auto disciplines below
    depends_on: [systematic-debugging, test-driven-development]
    # One-line patch, finishing a decision already made: using-superpowers omits references/**
    # (dead harness tool maps), and this body still sent the reader to two of those files. In
    # OpenCode the omit left that item with no bundle at all, so the emitter dropped the husk and
    # the target directory does not exist either. The clause named nothing but those two links;
    # the runtime paths it wrapped stay, because they are the ones our harnesses actually use.
    body: patch

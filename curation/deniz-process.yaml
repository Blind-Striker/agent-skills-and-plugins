    name: ask-deniz # one curated map for the whole estate, not upstream's own collection
    invocation: both # the user asks for a route, or the model loads it when the route is uncertain;
    # manual ceremonies remain conditional human pointers, never model-started workflows
    body: overlay # a router is the one artifact selection alone cannot curate. Upstream maps
    # upstream's own set, so every name in it is either right by luck or wrong on arrival: tdd,
    # code-review and diagnosing-bugs are merged away here, half this module is superpowers, and
    # /clear and /compact are Claude-only spellings. The shape is upstream's and worth keeping — main
    # flow, on-ramps, vocabulary underneath, phase boundaries — the routing is ours.
    # Stateful routing names only qualifying vocabulary and decisions because domain-modeling creates
    # GLOSSARY.md and ADRs lazily; the router must not promise files that the delegated skill may skip.
    # Upstream's read-first fix lands as its intent, curator's call: a summary is never grounds to
    # skip a step, so say what the step produces and let the user decide. Upstream sends the model to
    # open each skill's SKILL.md, a path this repo forbids into a manual body, and a load would start
    # the skill rather than read it. implement-spec, pr and retro get routes; retro pairs with
    # diagnosing-superpowers, which gathers evidence and gives no advice while retro proposes the
    # environment changes. The router names the original verified-waves as a user-pointer in two
    # rows, curator's routing call: the Standalone row is the start, and the dispatching row says
    # which of the two a person wants.
    # The conditional .NET map covers every General item, its nine manual ceremonies explicitly;
    # Aspire routes through its router/migration plus testing/ServiceDefaults specialists, and Akka
    # gets a compact full map. optional_refs checks those facts without requiring .NET Modules just
    # to install Process. Module guards and catalog checks distinguish unavailable model routes from
    # hidden manual items; no route authorizes an install. Agents stay descriptive delegation options,
    # not fake skill-load facts or slash commands. Ordinary one-sitting work need not open either
    # ladder, and an existing execution/workspace approval is not asked for again; the weight is the
    # agent's judgment, asked once only when genuinely torn. The .NET, Aspire, and Akka maps live in
    # references/dotnet.md, read only for .NET work: as a both router this body loads on uncertainty
    # in any repository, and the .NET map nearly doubled it. The description says when to load it
    # (unsure which skill fits, or asked) rather than only what it covers
    depends_on: [asd-ste100, brainstorming, codebase-design, delegating-to-worker-models, dispatching-parallel-agents, domain-modeling, grilling, receiving-code-review, systematic-debugging, test-driven-development, using-git-worktrees, verification-before-completion] # same-Module model facts; all conditional cross-Module facts/pointers are separate below

# Intended sources: every Superpowers skill, the selected Matt Pocock skills and Matt merge
# sources, and the ASD-STE100 root skill. The result is a personal transformation, not either
# upstream framework wholesale: overlapping TDD, debugging, and review material is merged; the Matt
# items read and rejected stay listed as excludes; no upstream hooks ship; triggers are tuned per
# item.
#
# Batch 1: the daily-flow spine — brainstorm/grill → plan →
# execute → review/verify — plus the passive disciplines. Invocation rule that shaped it:
# `manual` is unreachable even from another skill's body, so every link another taken skill
# invokes is `both` or `auto`; only true entry points are `manual`.
#
# Batch 2 closes the module: the selected Matt production chain, with its runtime setup behavior
# preserved but dead harness metadata omitted, plus the authoring pair and Superpowers' last two.
#
# Both merge passes have landed — the TDD mix (superpowers test-driven-development × matt tdd,
# which also repointed implement's two bare slash references) and the review mix
# (requesting-code-review × matt code-review). Every source item in both upstreams' promoted sets
# now has an answer here: taken, merged, or excluded with the reason beside it.
plugin:
  name: deniz-process
  description: "Deniz's curated process skills (brainstorming, planning, debugging)"
  version: 0.12.1
original_skills:
  delegating-to-worker-models:
    invocation: both # the user's routing decision spends the quota, not loading these rules, and the
    # failures it prevents happen when a coordinator writes a worker prompt without them; the narrow
    # description keeps it off ordinary in-harness subagent work, and the reliable trigger is the load
    # line its addendum template asks each dispatching repository to carry, curator's call
    depends_on: [delegating-to-worker-models, requesting-code-review] # requesting-code-review is the
    # coordinator's own review read. The self entry is the load line the addendum template hands each
    # dispatching repository, rendered in every harness's own spelling. verified-waves stays a
    # user pointer because the human starts that ceremony. Language test rules stay generic: Process
    # names no General skill, so a repository addendum quotes them
    # Model-specific countermeasures live one file per model under references/models/, curator's
    # call: not every model overbuilds, so the generic worker contract carries hygiene only
  verified-waves:
    invocation: manual # it spends many agents on one task, so the user starts it; in Claude Code
    # the invocation is the Workflow tool's own sanctioned opt-in (research decision 1). Its
    # small-task test counts only one item as small; a sequential chain cannot fan out but is not
    # small, so the agent judges whether a final gate and skeptic wave pay, asking once only when
    # genuinely torn, curator's call
    harness_files: # each harness reads only its own tool notes; no tree carries another's tool words
      references/harness-tools.md:
        claude: references/claude-code-tools.md
        codex: references/codex-tools.md
        opencode: references/opencode-tools.md
    # no depends_on: the body names no other skill
items:
  # --- superpowers spine: brainstorm → plan → execute → finish ---
  - source: superpowers/skills/brainstorming
    invocation: both # curator's call: reachable both ways — typed by hand, and a
    # skill-driven session may open the ceremony itself (using-superpowers routes "build X" here);
    # a project's exit invokes writing-plans (taken). Measured before flipping: the only
    # jump-pressure was the upstream description (overridden below); the v7 body carries no
    # "You MUST" of its own.
    # Body taken pristine, curator's call: v7 rebuilt it around drawing out intent first and sizing
    # the work after, which fits the no-heavy-ceremony-for-small-asks taste better than v6 did, and
    # patching a body upstream says it will keep tuning would cost a rebase on every tune. The patch
    # that namespaced the writing-plans handoff retired with it: v7 writes superpowers:writing-plans
    # itself.
    frontmatter:
      # replaces upstream's coercive trigger prose ("You MUST use this before any creative work");
      # read by a human browsing the / menu and by the model matching triggers — honest, no pressure.
      # Names v7's three sizes and the reach of its approval gate: a quick task is just done, a small
      # change is agreed in chat, and a project gets a written design. No body is owned here, so the
      # lock stamps upstream's SKILL.md under this override and an upstream rewrite stops the build.
      description: "Draws out what you want before anything is built, then sizes the work: a quick task is just done, a small change is agreed in chat, a project gets a written design. Nothing past a quick task is built before you approve."
    depends_on: [writing-plans]
  - source: superpowers/skills/writing-plans
    invocation: both # typed directly ("spec ve plan yazdır"), and brainstorming's exit invokes it — manual would break the chain
    body: patch # drops "(recommended)" from the plan header's subagent-driven-development option: the
    # handoff now recommends an executor for each plan, and a fixed label in every plan header would
    # pre-empt that choice. The description narrows upstream's "a multi-step task" to multi-session
    # work, or several people's worth, as ask-deniz's heavy ladder and brainstorming's sizing put it,
    # so a change that fits one sitting never automatically opens a plan document. The body now
    # enforces that gate before artifact creation. Work that arrives already sized is not sized
    # again: an explicit written-plan request (a typed invocation included), or a design the user
    # approved in brainstorming, whose agreed size the user could have overridden there.
    # The handoff distinguishes plan-only delivery from authorized execution: it preserves an
    # approved scope and chosen method instead of asking for the same approval again. Curator's
    # call: a request to build/add/fix ("let's add X") is a request to execute, so the agent goes on
    # into execution after summarizing the plan; only a plan-only or design-only request stops there. Without a
    # chosen method the agent picks the executor by judgment (context/isolation cost, not a fixed
    # subagent-first label) and asks once only when genuinely torn, curator's call: process weight
    # is automatic judgment, never a routine question
    depends_on: [executing-plans, subagent-driven-development, using-git-worktrees] # the handoff names both executors; worktree note in the header
  - source: superpowers/skills/subagent-driven-development
    invocation: both # "subagent'la ilerle" should be reachable by the model mid-conversation, and writing-plans' handoff invokes it.
    # Curator's call: with a written plan that request selects this workflow; without one it is plain
    # delegation (one briefed child the controller reviews), not the per-task ceremony
    body: patch # edits that keep the shared review contract whole; the description stays
    # upstream's. A body gate makes per-task orchestration a selected workflow, not the automatic
    # consequence of a plan: small/coupled work returns to ordinary inline execution with the
    # repository's completion checks, still test-first for behavior and root-cause debugging for an
    # unexplained failure. The weight is the agent's judgment; it asks once only when genuinely torn.
    # A resumed plan is never re-sized: the ledger's second line records the executor, so a later
    # session keeps the chosen workflow instead of downsizing a small remainder. Setup preserves an
    # already approved current checkout, so loading another skill does not reopen that choice; the
    # default branch counts as approved only by an earlier answer or a standing instruction, else one
    # question before the first commit there (upstream's main/master consent, kept without the loop).
    # The When-to-Use graph's inline branch reads "chosen or a better fit". In the selected heavy workflow, fix
    # rounds still run the project's whole suite after the covering tests, as the
    # test-driven-development overlay requires, where upstream said a one-line fix needs only the
    # covering tests: SKILL.md says so, its Example Workflow's fix round shows both runs, the final
    # fix wave's single fixer gets a report file and the same instruction, the implementer prompt's
    # fix round runs and reports both, and the re-review prompt checks the whole suite's output as
    # the evidence. The re-review reports that run as GREEN, RED, or MISSING: a MISSING run keeps the
    # round open, and a red test goes to New Breakage when the fix caused it, else out of scope. The
    # final whole-branch review triages the reviewer's "Declined to judge" list as ledgered rulings,
    # as executing-plans does; upstream's SDD never read that list. Before the first dispatch the
    # controller reads the one tool-notes file using-superpowers ships to every tree
    # (references/harness-tools.md), as executing-plans' no-subagent pointer does: upstream reached
    # those notes through its session bootstrap, which this estate does not ship, and on Codex and
    # OpenCode they say how to give a child a clean context and resume it.
    depends_on: [dispatching-parallel-agents, executing-plans, finishing-a-development-branch, requesting-code-review, systematic-debugging, test-driven-development, using-git-worktrees] # plain delegation's brief, the ledger's other executor, end-of-run finish, the reviewer template, small-path discipline, worktree setup
  - source: superpowers/skills/executing-plans
    invocation: both # SDD's no-subagent sibling; writing-plans' handoff names both — skipping it would need a body patch for zero gain.
    # v7 made it an autonomous inline executor — rule, ledger, continue; only four conditions stop
    # it — accepted, curator's call: a bad ruling surfaces in the closing "Rulings I made" list.
    body: patch # the prose runs this skill's scripts and SDD's through `bash`, and the
    # scripts exec SDD's helpers through "${BASH:-bash}" as SDD's own helpers do, so a packager that
    # strips executable bits cannot break the chain (upstream's own writing-skills rule). The
    # no-subagent pointer names the one tool-notes file using-superpowers ships to every tree
    # (references/harness-tools.md) instead of the folder of per-platform maps.
    # A body gate returns one-sitting work without a written plan to direct execution instead of
    # manufacturing another plan/workspace, still test-first and root-cause debugged; a written plan,
    # or one that already has a ledger, always runs the formal path however little is left, and
    # the ledger's second line records the executor so a resume keeps it. Setup respects an approved
    # current checkout and requests isolation only for a concrete need; the default branch needs an
    # earlier answer or a standing instruction, else one question before its first commit. The
    # description and When to Use say inline execution "was chosen", by the user or by the handoff's
    # judgment, since the handoff no longer always asks
    depends_on: [finishing-a-development-branch, requesting-code-review, subagent-driven-development, systematic-debugging, test-driven-development, using-git-worktrees, verification-before-completion, writing-plans] # the plan's source, TDD per task, debugging on a mismatch, verification before each claim, the final review's template, the finish
  - source: superpowers/skills/finishing-a-development-branch
    invocation: both # invoked from SDD/executing-plans bodies at the end of every run
  - source: superpowers/skills/using-git-worktrees
    invocation: auto # only ever reached from other skills' bodies or model judgment; asks consent itself before creating anything
    body: patch # an isolation gate respects the user's existing workspace choice and returns to
    # ordinary work when isolation was neither requested nor needed; creation consent stays mandatory
  # --- review pair ---
  - source: superpowers/skills/requesting-code-review
    invocation: both # typed as a ceremony ("review since main"), and the model fires it after a task; SDD also uses its code-reviewer.md template (cross-skill file dep)
    # Both files are a merge, curator's call: superpowers brings the dispatch protocol, the
    # severity calibration, the read-only discipline and the output format — the weight is in
    # code-reviewer.md, not the skill. mattpocock code-review brings what superpowers had no word
    # for: a STANDARDS axis with a real rubric (twelve Fowler smells, each a judgement call, the
    # repo's own documented standard overriding), range pinning that fails before a subagent burns
    # context on a bad ref, and spec-source discovery, which is what makes the typed "review since
    # X" use work at all. His two-axis separation is kept as a reporting rule — severity within an
    # axis, never across — because that insight is about masking, not about topology.
    # Topology is the one place we diverge from him: one reviewer by default, two only when the
    # spec is a genuinely separate document. subagent-driven-development's final whole-branch review,
    # the one review there that fills this template (its per-task reviews use its own
    # task-reviewer-prompt.md), has the plan AS the requirements, so a second subagent would read one
    # document twice for the range, in a skill that already warns its final-review fix wave outcosts
    # all its tasks.
    # code-reviewer.md keeps its name and place: SDD reaches it by relative path from three spots
    # including a flowchart, and validate now guards that (ADR-0008 path tier).
    # Superpowers v7's two reviewer sections are ported into that design, curator's call. "The spec
    # is a vision document" is split: its silence-is-not-permission half sits in the Spec axis and
    # reads only a supplied spec, its grade-by-effect half in Calibration for both axes. The
    # "Declined to judge" list goes to whichever reviewer holds the spec, and the typed "review
    # since X" path also rules on that list, as both executors do, and re-grades by effect, as
    # executing-plans does.
    # From code-review's later revisions, curator's call: the standards search must list
    # CODING_STANDARDS.md, where retro's judgement rules land, and CONTRIBUTING.md whenever they
    # exist, in SKILL.md and in the template's placeholder; and the coordinator waits for every
    # reviewer before reading or acting on any review, the outcome behind upstream's "foreground",
    # which is a Claude Code mechanism. The scope-creep and spec-quote wording stays ours: a finding
    # where the spec is silent may cite a reasonable user's expectation.
    # The description names only the body's mandatory moments (each subagent-driven-development
    # task, a major feature, a merge to main) and the typed range review, where upstream's
    # "completing a task" dispatched a reviewer after every small edit. Its route to
    # receiving-code-review excepts a plan executor's run, whose ruling rules win there, as that
    # skill's patch says.
    body: overlay
    merged_from: [mattpocock-skills/skills/engineering/code-review] # same-filename rule suffices — matt ships only a SKILL.md
    depends_on: [receiving-code-review] # taking the feedback is its own discipline, and it is taken
  - source: superpowers/skills/receiving-code-review
    invocation: auto # behavioural discipline that should kick in whenever review feedback arrives — never typed
    body: patch # one sentence, curator's call: while executing-plans or subagent-driven-development
    # runs, the executor's ruling rules win over this skill's stop-and-ask and implement-it-yourself
    # steps, which would otherwise stall the run or fix findings in the controller session. The
    # sentence states only that exception: outside such a run the skill applies to every review, a
    # reviewer subagent's findings as much as a human's, as requesting-code-review says
  # --- passive disciplines ---
  - source: superpowers/skills/test-driven-development
    invocation: auto # invoked from systematic-debugging's body and from implement's
    # Both files are a merge, curator's call: superpowers' discipline (Iron Law, watch-it-fail,
    # the rationalization tables) is the spine, and mattpocock tdd's one idea our set was missing
    # is installed as an organ — the SEAM. Two items we already ship point at the word and had
    # nowhere to send a reader: systematic-debugging Phase 6 ("at a correct seam") and implement
    # ("at pre-agreed seams"). Its second idea, one slice at a time / tracer bullets, names the
    # bulk-tests-first failure superpowers never named. Matt's gate ("no test at an unconfirmed
    # seam, confirm with the user") is kept as a conditional: this item is `auto` and fires
    # unprompted, so an unconditional human round-trip would make a discipline into an interrupt.
    # Refactor stays in the loop for cleanup under green; structural work routes to review, which
    # is where matt put all of it — both are true, so the contradiction dissolves.
    # matt's mocking.md contributes the boundary list superpowers lacked; its SDK-interface advice
    # is design prescription and belongs to codebase-design (taken). tests.md is not drawn from:
    # superpowers' own writing-good-tests.md is denser on the same ground, and its one unique
    # example — verifying around the interface instead of through it — was written fresh.
    # writing-good-tests.md is owned rather than patched because its citation of writing-skills is
    # a dangling model-edge in our set (that target is manual), so the file could not flow pristine.
    # Superpowers v7's whole-suite paragraph is ported verbatim under GREEN, with a one-line relay at
    # the checklist; subagent-driven-development's fix rounds are patched to match it.
    # matt tdd's later seam note is ported into the conditional seam paragraph: each proposed seam
    # gets a one-line note on what it catches and what it misses.
    body: overlay
    merged_from:
      - source: mattpocock-skills/skills/engineering/tdd
        files: [SKILL.md, mocking.md] # where the merge actually drew from — not the filename rule
    depends_on: [requesting-code-review, systematic-debugging] # structural refactor routes out; bugs route in
    frontmatter:
      # auto item, so the description is the trigger: it now covers the seam and the slice, not
      # just the red-green loop, and an honest trigger line is half of taking the pressure out
      description: "Use when implementing any feature or bugfix, before writing implementation code — the red-green loop, the seam to test at, and one slice at a time"
  - source: superpowers/skills/verification-before-completion
    invocation: auto # fires before any "done" claim; clears the other 2 standing warnings
  - source: superpowers/skills/systematic-debugging
    invocation: auto # debugging discipline should engage when a bug appears, unprompted
    depends_on: [test-driven-development, verification-before-completion] # Phase 6 invokes both
    # SKILL.md is a merge, curator's call: superpowers' root-cause armor + mattpocock
    # diagnosing-bugs' feedback-loop engineering, in seven phases. The overlay covers SKILL.md
    # only, so the sibling technique files keep flowing from upstream; the merge source is
    # blessed below — its drift stops the build exactly like the primary's.
    # diagnosing-bugs' later forced-red check sits in Phase 6 step 1 only: a red forced by mutating
    # code or a fixture is diffed against a pristine copy before it is trusted. Its route to retro
    # lives in ask-deniz, as upstream's lives in its router.
    body: overlay
    merged_from: [mattpocock-skills/skills/engineering/diagnosing-bugs]
    frontmatter:
      # merged skill also covers matt's perf-regression ground, so the trigger names it
      description: "Use when encountering any bug, test failure, performance regression, or unexpected behavior, before proposing fixes"
    omit: # author-facing material shipped alongside the skill (see upstream-repo-layouts.md)
      - CREATION-LOG.md
      - test-academic.md
      - "test-pressure-*.md"
  - source: superpowers/skills/using-superpowers
    invocation: manual # the opt-in "work skill-driven this session" switch — flipped by hand, never a bootstrap hook (ADR-0007)
    # Softened body, curator's call (level ii of three): the "1% chance" coercion block and the Red
    # Flags rationalization table are cut; the ordering rule (process skills before implementation),
    # the announce habit and the subagent guard stay. It is invoked by hand, so the persuasion
    # apparatus has no one left to persuade.
    # Platform Adaptation stays, as one neutral line: each harness reads only its own tool notes at
    # references/harness-tools.md (harness_files below), so no tree carries another harness's tool
    # words. Claude Code and Codex get upstream's notes. OpenCode gets ours, added by the patch:
    # upstream's OpenCode 2 map lives only in its bootstrap plugin, which does not ship here.
    body: patch
    depends_on: [brainstorming, subagent-driven-development, systematic-debugging] # the ordering rule's two worked examples; Claude Code's notes run subagent-driven development one layer down
    frontmatter:
      # manual → the description's only reader is a human browsing the menu
      description: "Switch this session to skill-driven working: check for a relevant skill before each task, process skills first."
    harness_files:
      references/harness-tools.md:
        claude: references/claude-code-tools.md
        codex: references/codex-tools.md
        opencode: references/opencode-tools.md # authored in overlay.patch
    omit: # tool notes for harnesses this estate does not emit
      - references/antigravity-tools.md
      - references/gemini-tools.md
      - references/hermes-tools.md
      - references/muse-tools.md
      - references/pi-tools.md
  # --- mattpocock grilling core ---
  # All matt items omit agents/** — every matt skill bundles an agents/openai.yaml, which is
  # Codex/OpenAI harness config; dead weight in both of our target harnesses.
  - source: mattpocock-skills/skills/productivity/grill-me
    invocation: manual # 7-line trigger whose whole body is "Run a /grilling session" — the composition pattern's cleanest example
    body: patch # namespaces the grilling handle, so each harness renders a skill-tool sentence it can follow
    depends_on: [grilling]
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/productivity/grilling
    invocation: auto # the knowledge grill-me/grill-with-docs invoke; upstream marks it model-invoked for exactly this reason
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/grill-with-docs
    invocation: manual # stateful grill (GLOSSARY.md + ADRs); entry point, drags domain-modeling (taken)
    body: patch # namespaces both handles, so each harness renders a skill-tool sentence it can follow
    depends_on: [domain-modeling, grilling]
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/domain-modeling
    invocation: auto # vocabulary layer grill-with-docs drives; other skills reach it by name
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/productivity/handoff
    invocation: manual # small, dependency-free, immediately useful session bridge. Stays a skill,
    # not as: command: OpenCode 2 attaches it with @ like every manual item, and its argument-hint
    # stays advisory
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/diagnosing-bugs
    exclude: true # not rejected — merged: its feedback-loop phases live inside the
    # systematic-debugging overlay; taking it as well would put two auto debugging
    # skills in trigger competition
  # --- mattpocock production chain (batch 2) ---
  - source: mattpocock-skills/skills/engineering/to-spec
    invocation: manual # upstream's own flag; conversation → spec ceremony
    body: patch # make the missing-setup handoff a namespaced user pointer so each emitter renders its native syntax
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/to-tickets
    invocation: manual # upstream's own flag; spec → tracer-bullet tickets
    body: patch # distinguish the explicit setup handoff from a prose mention of the configured tracker
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/triage
    invocation: manual # upstream's own flag; issue-tracker state machine
    body: patch # upstream's own skill-tool sentence for the grill, its two handles namespaced so each
    # harness renders the call natively; the setup handoff is a namespaced user pointer, and the
    # two `/triage` self-references read as prose, since no harness spells this skill that way
    depends_on: [grilling, domain-modeling]
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/wayfinder
    invocation: manual # upstream's own flag; the heaviest ceremony — decision maps for foggy efforts
    body: patch # localize the explicit setup prerequisite and the research, prototype, grilling, and domain-modeling handles through the shared reference grammar
    depends_on: [domain-modeling, grilling, prototype, research]
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/implement
    invocation: manual # upstream's own flag; the ceremony that opens an implementation run
    # Two-line patch, curator's call: upstream's own skill-tool sentences, their handles namespaced to
    # the merged TDD and review items that replace matt's tdd and code-review here; each harness
    # renders the call natively. No setup pointer for the ticket fetch.
    body: patch
    depends_on: [requesting-code-review, test-driven-development]
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/implement-spec
    invocation: manual # upstream's own flag; the parallel executor for a spec's ticket graph, where
    # subagent-driven-development works a plan and forbids parallel implementers.
    # Body patch, curator's call: the two skill-tool sentences name the merged TDD and review items,
    # as implement's do; the setup handoff is a namespaced user pointer; the description is one
    # sentence of 64 characters or fewer, so the Codex menu label shows it whole; one line creates
    # each implementer's worktree with git where the harness has no per-subagent worktree (OpenCode 2
    # records none). Upstream's own documented run rules land as one sentence each: seams come from
    # the spec or ticket, and a background implementer reports back rather than guess one; the
    # frontier comes from what merged into the integration branch; two frontier tickets sharing a
    # file run in order or share fixed names; a ticket that needs untracked fixtures runs in the
    # main checkout; and after the single fix subagent only the fixed findings are re-checked, with
    # no second broad review, while the project's whole test suite still runs, as the TDD overlay
    # and subagent-driven-development's fix rounds require. Codex CLI ships a subagent tool,
    # spawn_agent, on by default, so the parallel path applies there too; no run has measured it.
    body: patch
    depends_on: [requesting-code-review, test-driven-development]
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/pr
    invocation: manual # curator's call, diverging from upstream's model-invoked default: it shapes a
    # pull request body only when typed. superpowers' finishing-a-development-branch already follows
    # a repository's own template, so a PR the agent opens unasked still has a shape.
    # Body patch: a pull request template the repository already has wins, and this skill fills
    # only that template's matching sections; the nested metadata.credits leaves the frontmatter,
    # because the credit lives in CREDITS.md and the notice packs; CREDITS.md links to show-me in
    # humanlayer/skills, where upstream's link pointed at humanlayer/humanlayer.
    body: patch
    merged_from:
      # attribution only, never curated: the Summary section reproduces HumanLayer's show-me
      # almost word for word by upstream's own credit, so its MIT license ships in every notice pack
      - source: humanlayer-skills/plugins/show-me/skills/show-me
        files: [SKILL.md]
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/setup-matt-pocock-skills
    invocation: manual # curator's call: the wizard comes too — useful, harmless, pure runtime
    body: patch # normalize references in the installed tracker/domain templates across harnesses:
    # they are copied into a consumer repo, so they keep bare names, never this repo's namespace.
    # SKILL.md, curator's call: the "Agent skills" block goes to AGENTS.md, created when missing,
    # and the draft proposes a bare `@AGENTS.md` line for a CLAUDE.md that does not import it,
    # because OpenCode and Codex never read CLAUDE.md, so tracker settings written there would leave
    # the ticket skills blind in both. Section B always runs, since triage ships in this plugin: the
    # "is triage installed?" probe could miss OpenCode's unadvertised deniz-process.triage, and a
    # model edge into a manual item cannot be declared. The draft lists the labels step 4 will
    # create on a remote tracker, so that change is approved before it runs.
    omit: ["agents/**"]
  # --- mattpocock design & standalone (batch 2) ---
  - source: mattpocock-skills/skills/engineering/codebase-design
    invocation: auto # a glossary other skills pull in, not a ceremony — `both` was floated, flipping is one word if typing it ever feels natural
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/improve-codebase-architecture
    invocation: manual # upstream's own flag; spare-moment architecture survey
    body: patch # make the load-bearing codebase-design, grilling, and domain-modeling edges harness-native
    depends_on: [codebase-design, domain-modeling, grilling]
    omit: ["agents/**"]
  - source: mattpocock-skills/skills/engineering/research
    invocation: both # curator's call: "şunu araştır" is as natural typed as model-delegated
    # First cross-framework stitch, curator's idea: the background-agent dispatch is crafted per

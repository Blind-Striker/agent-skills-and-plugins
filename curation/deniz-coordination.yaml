# Intended sources: none upstream. This Module holds coordination (ADR-0009): the coordinator role,
# the craft of handing work to a worker model of another family, the delegation mechanisms the craft
# can use beyond the host's own subagents (the dispatch harness, a .NET file-based app bundled as the
# harness skill's source, and T3 Code), the model profiles a user may name for that craft, and verified-waves, the verified multi-agent ceremony for
# harnesses without a native workflow tool the user opts into. Each skill ships only to the harnesses it serves
# (ADR-0010). It requires Process for the coordinator's review read; Process reaches it only through
# guarded optional pointers.
plugin:
  name: deniz-coordination
  description: "Deniz's coordination skills (the coordinator mode, the delegation craft, model profiles, the dispatch harness and T3 Code as delegation mechanisms, verified waves)"
  version: 0.3.0
original_skills:
  coordinator:
    invocation: both # it makes the agent own the goal, plan, hand work to other agents, and review it.
    # It was manual, but Claude Code renders manual as disable-model-invocation, so a lane that a lead
    # opened, or that resumed after a restart, could not load it from its brief; lanes on Claude Code
    # coordinated from their handoffs without it, and one kickoff used Codex's `$` spelling, which
    # loads nothing there. So it is model-invocable with a description that fires only when the user
    # or a lead's brief asks for a coordinator or lane lead, curator's call (ADR-0009). Loading it is
    # no longer the request for workers: the request text is (the user, or a coordinator the user
    # started, asked for a coordinated or delegated run), so a self-loaded coordinator authorizes
    # nothing. It names no tool: the
    # craft picks the model first and then a mechanism that reaches it, with no fixed order among
    # mechanisms, curator's call. In T3 Code the curator had to paste a "T3 only, ignore the dispatch
    # harness" paragraph into every lane while these notes pinned the harness
    depends_on: [delegating-to-worker-models] # the body loads the craft
  verified-waves:
    invocation: manual # it spends many agents on one task, so the user starts it. Its
    # small-task test counts only one item as small; a sequential chain cannot fan out but is not
    # small, so the agent judges whether a final gate and skeptic wave pay, asking once only when
    # genuinely torn, curator's call. The yes/no questions before destructive or outward actions
    # apply unless the request already names that action. The skill never picks a child's model or
    # routing agent, curator's call: OpenCode uses the agent the user's configuration
    # or instructions name for delegated work (a routing agent that maps to a model), falling back to
    # `general` or the default workflow agent, and any such agent must allow edit and write; Codex
    # already left routing to `[agents] default_subagent_model`. GPT runs stalled after six children:
    # the ceiling now reads as a limit, not a target, the agent total is counted from the plan and
    # excludes retries of FAILED items, and the Codex V1 loop closes every recorded child before the
    # next spawn and keeps waiting after a thread-limit failure instead of ending the turn. V1 is
    # unmeasured (the Codex panel record was served V2), so the slot-leak reading is inferred, and
    # Codex's catalog serves Sol V2, so it covers Sol only under a V1 override. On both OpenCode and
    # Codex a child's completion is not a check-in: the next PENDING item launches without asking
    harnesses: [opencode, codex] # it brings a verified fan-out to harnesses without a native workflow
    # tool the user opts into; Claude Code starts the same run through its own workflow tool, so it
    # never carries the skill, curator's call (ADR-0009)
    harness_files: # each harness reads only its own tool notes; no tree carries another's tool words
      references/harness-tools.md:
        claude: null
        codex: references/codex-tools.md
        opencode: references/opencode-tools.md
    # no depends_on: the body names no other skill
  model-profiles:
    invocation: both # one curator's profiles of the models they delegate to: roles, cost, how to brief
    # each model, its worker block, and where to look in review. They moved out of the craft so the
    # craft names no model, curator's call: the module is open source and used by other teams, and model
    # names go stale within weeks. Model-invocable so a lane loads them from its brief; they take
    # effect only when the user, a brief, or the repository addendum names them, so loading alone
    # chooses no model. Model-specific countermeasures still live one file per model under
    # references/, curator's call: not every model overbuilds, so the generic worker contract carries
    # hygiene only
    depends_on: [delegating-to-worker-models] # the body names the craft whose model slots it fills
  delegating-to-worker-models:
    invocation: both # the failures it prevents happen when an agent writes another agent's prompt
    # without these rules, and coordinator loads it by name, so the model must be able to invoke it;
    # the description names the hand-off, not a tool, so it serves every subagent mechanism, and the
    # repository addendum's load line is the reliable trigger, curator's call (ADR-0009)
    depends_on: [delegating-to-worker-models, requesting-code-review, harness, t3-delegation, model-profiles] #
    # requesting-code-review is the coordinator's own review read, and it makes this Module require
    # Process. The self entry is the load line the addendum template hands each dispatching repository,
    # rendered in every harness's own spelling. The body names model-profiles as an option the user
    # names, never a default, so the craft names no model. The body names t3-delegation, which ships everywhere;
    # only the Claude Code and Codex host notes name the harness, so its reachability is checked in
    # those trees (ADR-0010). Language test rules stay generic: this
    # Module names no General skill, so a repository addendum quotes them
    # Intake for pilot lessons, curator's call: a lesson enters the body only when it holds beyond one
    # repository or tool, is not an instance of an existing rule, and recurred or cost real money;
    # otherwise it goes to the research note's pilot log. The per-case coordinator rules from the
    # first pilot day were folded into one no-contradiction pass for that reason. The general
    # coordinating practices of a three-day, six-lane T3 run (a worker's lifetime: one checkpoint per
    # worker, usage, restarts, settling from records, cleanup; slow or shared checks; evidence by its
    # cause; the review bar; landing) passed that intake: each recurred or cost real money. Efficiency
    # (less waste at the same quality) is the craft's; a saving that trades quality, coverage or speed
    # for money is the user's, curator's call
    harness_files: # each harness reads only its own subagent and session notes
      references/host-tools.md:
        claude: references/claude-code-tools.md
        codex: references/codex-tools.md
        opencode: references/opencode-tools.md
  t3-delegation:
    invocation: both # the craft loads it by name when T3's delegate_task is in the tool list, and the
    # user reaches it with "delegate through T3"; it maps the craft onto T3 and repeats none of T3's
    # own orchestration instructions, which win where they differ, curator's call. Its content is the
    # method a T3 coordinator built by hand: pasted contract, base-SHA stop, settling
    # from git for want of a write fence, and the model and usage record from OpenCode's database
    # while T3's executedModel stays null for OpenCode children. The restart check and the interrupt
    # through the service's owner are the measured method from an orphaned child that ran for hours
    # after T3 showed it cancelled. It names no provider or model, because orchestrator_capabilities lists
    # them. Ships to every harness: a T3 session can run on any of the three
    depends_on: [delegating-to-worker-models] # the body maps that craft's steps
  harness:
    invocation: both # model-invocable so callers (a coordinator, a task-file tool, a colleague's skill)
    # can load it by name: a manual skill cannot be loaded through the skill tool. It runs only when
    # the user asks for workers (ADR-0009). Its section for the delegation craft holds the mapping that
    # the coordinator's Claude Code and Codex notes carried, so a caller that does not follow the craft
    # still uses it alone
    harnesses: [claude, codex] # OpenCode reaches many model families natively, so a coordinator there
    # starts workers without this tool, curator's call (ADR-0009)
    # no depends_on: the body names no other skill

name: dispatch
# The dispatch harness's own job (ADR-0009): its build gate, its usage exit, and its .NET tests on
# every operating system the first release supports. It stays apart from validate, so a .NET failure
# never hides a curation one, and it has no path filter, so it can be a required check. Tests that
# need a model login are opt-in and never run here.
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A run takes about 25 minutes on Windows; a hung test otherwise holds the runner for six hours.
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The harness pins the SDK; the tests' global.json must equal it (LayoutTests).
          global-json-file: skills/deniz-coordination/harness/global.json
          cache: true
          cache-dependency-path: tests/dispatch/packages.lock.json
      - name: Build gate, from the harness folder as the skill runs it
        working-directory: skills/deniz-coordination/harness
        run: dotnet build dispatch.cs
      - name: The entry prints its usage and exits 2 with no command
        working-directory: skills/deniz-coordination/harness
        shell: bash
        run: |
          set +e
          dotnet dispatch.cs --
          code=$?
          if [ "$code" -ne 2 ]; then
            echo "expected the usage exit code 2, got $code"
            exit 1
          fi
      # The schema contract test (P2) runs on one OS with the Codex CLI the harness pins. The CLI goes
      # into a private prefix, never globally and never on PATH, so only P2 can resolve it, and only
      # through DISPATCH_CONTRACT_CODEX. Its schema generation needs no login. Keep the version equal
      # to the harness pin; S5 compares them.
      - name: Pinned Codex CLI for the schema contract test (Linux only)
        if: runner.os == 'Linux'
        run: npm install --no-save --prefix "$RUNNER_TEMP/codex" @openai/codex@0.163.0
      # On Linux the harness fences opencode tasks with bubblewrap and refuses them when it cannot (no
      # unfenced fallback). The runner gets bubblewrap, and its user-namespace restriction is lifted on
      # this throwaway VM only when bwrap reports exactly that failure. Operators decide that on real hosts.
      - name: bubblewrap for the opencode fence (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if ! bwrap --ro-bind / / --dev /dev true 2>bwrap.err; then
            cat bwrap.err
            # Ubuntu 24.04's AppArmor restriction shows as "setting up uid map: Permission denied".
            if grep -qiE "namespace|uid map" bwrap.err; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
            bwrap --ro-bind / / --dev /dev true
          fi
      # The Windows runner's OS disk (C:) stalls writes for seconds, and tests that wait on a child
      # process stretch with it; the runner's temp disk does not. The checkout is already there.
      - name: Keep temp on the runner's temp disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TEMP=$temp" | Add-Content -LiteralPath $env:GITHUB_ENV
          "TMP=$temp" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Build the tests
        working-directory: tests/dispatch
        # Apart from the test run, so a stall shows which half it is in.
        timeout-minutes: 15
        run: dotnet build -c Release
      - name: Unit and Integration tests
        if: runner.os != 'Windows'
        working-directory: tests/dispatch
        # Inside the job's limit, so a hung test still leaves its dump, results and log behind:
        # the session ends at 40 minutes, and a test stuck for 15 is dumped first.
        timeout-minutes: 50
        shell: bash
        env:
          DISPATCH_CONTRACT: ${{ runner.os == 'Linux' && '1' || '' }}
          DISPATCH_CONTRACT_CODEX: ${{ runner.os == 'Linux' && format('{0}/codex/node_modules/.bin/codex', runner.temp) || '' }}
        # Output goes to a file, not the step's pipe: a step ends only when every process holding its
        # pipe has exited, so a process a test leaves behind would keep it open past every timeout.
        run: |
          set +e
          dotnet run -c Release --no-build -- --treenode-filter "/*/*/*/*[Category!=Functional]" --results-directory "$GITHUB_WORKSPACE/test-results" \
            --timeout 40m --hangdump --hangdump-timeout 15m --hangdump-type Mini > "$RUNNER_TEMP/tests.log" 2>&1
          code=$?
          # TUnit colors its lines; strip the codes so the failed tests and the totals are found.
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/tests.log" | grep -E -A6 "^failed " | tail -n 300
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/tests.log" | grep -E "^  (failed|succeeded|skipped|duration):"
          exit $code
      # Windows step timeouts did not end a hung run: the step waited past its limit. A watchdog in the
      # step ends it instead. The tests start through ShellExecute in a hidden window, so they inherit
      # none of the step's handles; at 45 minutes the watchdog prints what still runs and kills the tree.
      - name: Unit and Integration tests (Windows, with a watchdog)
        if: runner.os == 'Windows'
        working-directory: tests/dispatch
        timeout-minutes: 55
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'tests.log'
          $results = Join-Path $env:GITHUB_WORKSPACE 'test-results'
          $script = Join-Path $env:RUNNER_TEMP 'run-tests.cmd'
          @(
            '@echo off'
            "dotnet run -c Release --no-build -- --treenode-filter ""/*/*/*/*[Category!=Functional]"" --results-directory ""$results"" --timeout 40m --hangdump --hangdump-timeout 15m --hangdump-type Mini > ""$log"" 2>&1"
          ) | Set-Content -LiteralPath $script -Encoding ascii
          $started = Get-Date
          $run = Start-Process -FilePath $script -WindowStyle Hidden -PassThru
          $null = $run.Handle
          if (-not $run.WaitForExit(45 * 60 * 1000)) {
            'WATCHDOG: the tests still run after 45 minutes; processes started since the tests began:'
            Get-CimInstance Win32_Process | Where-Object { $_.CreationDate -ge $started.AddSeconds(-5) } |
              Select-Object ProcessId, ParentProcessId, Name, CreationDate, CommandLine | Format-List | Out-String -Width 400
            'WATCHDOG: the last 150 lines of the test log:'
            Get-Content -LiteralPath $log -Tail 150
            taskkill /T /F /PID $run.Id
            exit 1
          }
          $lines = ((Get-Content -LiteralPath $log -Raw) -replace "`e\[[0-9;]*m", '') -split "`r?`n"
          $lines | Select-String -Pattern '^failed ' -Context 0, 6 | ForEach-Object { $_.ToString() }
          $lines | Select-String -Pattern '^  (failed|succeeded|skipped|duration):' | ForEach-Object { $_.Line }
          exit $run.ExitCode
      - name: The tests' last output, after a failure or a timeout
        if: failure() || cancelled()
        shell: bash
        run: tail -n 200 "$RUNNER_TEMP/tests.log" || true
      - name: Processes the tests left running
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $left = Get-CimInstance Win32_Process | Where-Object { "$($_.ExecutablePath) $($_.CommandLine)" -like "*$env:GITHUB_WORKSPACE*" }
          if ($left) { $left | Select-Object ProcessId, ParentProcessId, Name, CommandLine | Format-List | Out-String -Width 400 } else { 'none' }
      - name: Keep the results and any hang dump
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dispatch-test-results-${{ matrix.os }}-${{ github.run_id }}
          path: test-results/**
          if-no-files-found: ignore

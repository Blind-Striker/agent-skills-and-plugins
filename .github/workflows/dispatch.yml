name: dispatch
# The dispatch harness's own job (ADR-0009): its build gate, its usage exit, and its .NET tests on
# every operating system the first release supports. It stays apart from validate, so a .NET failure
# never hides a curation one, and it has no path filter, so it can be a required check. Tests that
# need a model login are opt-in and never run here.
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The harness pins the SDK; the tests' global.json must equal it (LayoutTests).
          global-json-file: skills/deniz-coordination/harness/global.json
          cache: true
          cache-dependency-path: tests/dispatch/packages.lock.json
      - name: Build gate, from the harness folder as the skill runs it
        working-directory: skills/deniz-coordination/harness
        run: dotnet build dispatch.cs
      - name: The entry prints its usage and exits 2 with no command
        working-directory: skills/deniz-coordination/harness
        shell: bash
        run: |
          set +e
          dotnet dispatch.cs --
          code=$?
          if [ "$code" -ne 2 ]; then
            echo "expected the usage exit code 2, got $code"
            exit 1
          fi
      # The schema contract test (P2) runs on one OS with the Codex CLI the harness pins. The CLI goes
      # into a private prefix, never globally and never on PATH, so only P2 can resolve it, and only
      # through DISPATCH_CONTRACT_CODEX. Its schema generation needs no login. Keep the version equal
      # to the harness pin; S5 compares them.
      - name: Pinned Codex CLI for the schema contract test (Linux only)
        if: runner.os == 'Linux'
        run: npm install --no-save --prefix "$RUNNER_TEMP/codex" @openai/codex@0.163.0
      # TEMPORARY diagnostic for the macOS hang; drop this step before merge.
      - name: macOS hang probe (temporary)
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: tests/dispatch
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/probe.log"
          dotnet run -c Release -- --treenode-filter "/*/*/VerifierTests/Verify_UsesTaskTemp" > "$log" 2>&1 &
          runner=$!
          for i in $(seq 1 30); do sleep 5; kill -0 "$runner" 2>/dev/null || break; done
          echo "== after ${i}x5s the test runner is $(kill -0 "$runner" 2>/dev/null && echo still running || echo finished)"
          echo "== process tree"
          ps -axo pid,ppid,pgid,stat,etime,command | grep -E "dotnet|dispatch|opencode|git|bash|sh -c|Dispatch" | grep -v grep
          echo "== pipes held by each candidate"
          for p in $(pgrep -f "dispatch.dll|FakeOpenCode|Dispatch.Tests"); do
            echo "-- pid $p: $(ps -o command= -p "$p")"
            lsof -p "$p" 2>/dev/null | grep -E "PIPE|FIFO"
          done
          echo "== harness ledgers"
          find "$GITHUB_WORKSPACE/tests/dispatch/bin" -name events.jsonl 2>/dev/null | while read -r f; do echo "-- $f"; tail -20 "$f"; done
          echo "== async stacks of the harness (which await is parked: StopTreeAsync, DisposeCoreAsync, ...)"
          dotnet tool install dotnet-dump --tool-path "$RUNNER_TEMP/tools" > /dev/null 2>&1
          for p in $(pgrep -f "dispatch.dll"); do
            "$RUNNER_TEMP/tools/dotnet-dump" collect -p "$p" --type Heap -o "$RUNNER_TEMP/harness-$p.dmp" > /dev/null 2>&1
            "$RUNNER_TEMP/tools/dotnet-dump" analyze "$RUNNER_TEMP/harness-$p.dmp" -c "dumpasync --stacks" -c "exit" 2>&1 \
              | grep -v -E "^\s*$" | grep -E -v "System\.(Threading|Runtime)\." | head -150
          done
          echo "== native stacks of the harness"
          for p in $(pgrep -f "dispatch.dll"); do sample "$p" 2 2>/dev/null | grep -E "Thread_|wait|kevent|read|poll|select" | head -40; done
          echo "== probe log"
          tail -80 "$log"
          pkill -f FakeOpenCode; pkill -f "dispatch.dll"; kill "$runner"; pkill -f Dispatch.Tests
          exit 0
      - name: Unit and Integration tests
        working-directory: tests/dispatch
        env:
          DISPATCH_CONTRACT: ${{ runner.os == 'Linux' && '1' || '' }}
          DISPATCH_CONTRACT_CODEX: ${{ runner.os == 'Linux' && format('{0}/codex/node_modules/.bin/codex', runner.temp) || '' }}
        run: dotnet run -c Release -- --treenode-filter "/*/*/*/*[Category!=Functional]"

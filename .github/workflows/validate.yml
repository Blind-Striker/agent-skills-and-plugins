name: validate
on:
  push:
    branches: [master]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run inventory
      - run: npm run validate
      - name: Built output must be committed and fresh
        run: |
          git add -A -- plugins opencode dist .claude-plugin docs/inventory.md docs/ledger.json
          git diff --cached --exit-code -- plugins opencode dist .claude-plugin docs/inventory.md docs/ledger.json
